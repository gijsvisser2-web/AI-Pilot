# Inhoud van sessie 3: Test en besluit. Pas teksten, prompts en codewoorden hier aan.
# In prompts vult de app {functie}, {afdeling}, {taak}, {instructie} en {input} in.

titel: "Test en besluit"
pilot: "AI-pilot Customer Care"
sessie: "Sessie 3"

codewoorden:
  start: "TWEETAL"
  verder: "BESLUIT"

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen klantgegevens invullen of plakken, ook niet in de chat van de breakout room."

start:
  tekst: "Je hebt een eigen werkwijze. Vandaag test een collega hem op echt werk. Daarna besluit je wat je ermee doet. Houd je pdf van sessie 2 bij de hand."
  zo_werk_je: "Zet deze app links op je scherm en Copilot Chat rechts."
  waarom: "Een werkwijze die alleen werkt als jij erbij bent, kun je niet delen. Pas als een ander hem zonder uitleg kan gebruiken, weet je wat hij waard is."
  functie_label: "Mijn functie (bijvoorbeeld: medewerker klantenservice, specialist schade, teamleider)"
  functie_hulp: "De app zet je functie en afdeling in de hulpprompts. Geen naam invullen."
  afdeling_label: "Mijn afdeling of team (bijvoorbeeld: Customer Care, Finance, HR)"
  afdeling_standaard: "Customer Care"

stappen:
  waar:
    titel: "Waar sta je?"
    tijd: 8
    intro: "Pak je pdf van sessie 2 erbij. Plak je instructie en vul in hoe je hem de afgelopen tijd gebruikte."
    instructie_label: "Mijn instructie, versie 0.2 (staat in je pdf bij 6)"
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar", "Niet gedaan"]
    opbrengst: ["Sneller", "Beter", "Consistenter", "Makkelijker", "Geen voordeel"]
    niet_getest: "Niet getest? Dan is vandaag je eerste echte test. Dat geldt voor meer mensen."
    waarom_niet: ["Geen tijd", "Vergeten", "Wist niet hoe", "Geen geschikte taak voorbijgekomen", "Anders"]
    vinkje_intro: "Staat je instructie erin? Zet dan het vinkje."
    vinkje: "Mijn instructie staat erin"
    waarom: "Wat je deed sinds sessie 2 zegt meer dan wat je in een sessie deed. Hier begint je besluit."

  pakket:
    titel: "Maak je testpakket"
    tijd: 7
    intro: "Je collega gaat jouw werkwijze testen. Hij krijgt alleen je instructie en 1 input. Kies een echte taak van deze week."
    taak_label: "Welke taak van deze week gebruik je? (in algemene woorden)"
    input_label: "Je input voor de tester (de tekst die je normaal aan Copilot geeft, zonder klant- of persoonsgegevens)"
    punten_label: "Denk eerst: welke 3 punten moeten zeker in het resultaat staan? (de tester ziet deze pas na zijn test)"
    kleur_vraag: "Mag het? Kies 1 kleur voor je input"
    kleuren:
      - "Groen: geen klant- of persoonsgegevens"
      - "Oranje: ik twijfel"
      - "Rood: er zitten klantgegevens in"
    groen: "Ga door."
    oranje: "Maak je input algemeen of verzonnen. Twijfel je nog? Vraag het AI CoE."
    rood: "Niet gebruiken. Maak een verzonnen versie van dezelfde taak en zet die in het veld hierboven."
    rood_vinkje: "Ik gebruik nu een verzonnen versie"
    hulp_titel: "Hulp: maak een verzonnen versie"
    verzonnen_prompt: "Maak een verzonnen versie van deze input, voor mijn werk als {functie} bij {afdeling}: [beschrijf de input in algemene woorden, plak geen echte gegevens]. Houd de situatie hetzelfde. Gebruik geen echte namen, adressen, telefoonnummers of zendingnummers."
    pakket_label: "Jouw testpakket: plak dit in de chat van de breakout room"
    pakket: |-
      Instructie: {instructie}

      Input: {input}
    vinkje: "Mijn testpakket bevat geen klant- of persoonsgegevens"
    waarom: "Een test op verzonnen werk zegt weinig. Een test op echt werk van deze week laat zien of je werkwijze het dagelijkse werk aankan."

  tweetal:
    titel: "Testen in tweetallen"
    tijd: 35
    intro: "Je werkt in een tweetal in een breakout room. Er zijn 2 rondes van 15 minuten. In ronde 1 ben je maker of tester, in ronde 2 wissel je. Gijs roept de tijd af."
    ronde:
      - "Lezen, 2 minuten. De maker plakt zijn testpakket in de chat. Geen uitleg. De tester leest."
      - "Testen, 8 minuten. De tester deelt zijn scherm, opent een nieuw gesprek in Copilot, plakt instructie en input en stuurt bij als dat nodig is. De maker zwijgt."
      - "Beoordelen, 3 minuten. De maker laat zijn 3 punten zien. De tester beoordeelt de uitkomst met Klopt, Past, Helpt, Mag het."
      - "Terugkoppelen, 2 minuten. De tester zegt 1 ding: wat was onduidelijk, of waar moest hij gokken?"
    aarzel_label: "Waar aarzelde de tester, of wat begreep hij niet?"
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    punten_opties: ["Alle 3", "1 of 2", "Geen"]
    herstel_label: "Wat moest de tester zelf nog doen voordat het bruikbaar was?"
    ding_label: "Het 1 ding dat de tester teruggaf"
    leer_label: "Wat zou ik van deze werkwijze ook in mijn eigen werk kunnen gebruiken?"
    vinkje_intro: "Allebei geweest? Zet dan de vinkjes."
    vinkjes:
      - "Ik ben maker geweest"
      - "Ik ben tester geweest"
    waarom: "Als maker vul je ongemerkt gaten in, omdat je weet wat je bedoelt. Een tester doet dat niet. Daarom zwijg je als maker. Alleen dan zie je waar je instructie tekortschiet."

  verander:
    titel: "Verander 1 ding"
    tijd: 8
    intro: "Gebruik het 1 ding dat de tester teruggaf. Pas je instructie aan. Alleen dat ene ding."
    v03_label: "Mijn instructie, versie 0.3 (hier staat versie 0.2, pas 1 ding aan)"
    aanpas_label: "Wat pas je aan, en waarom?"
    vinkje: "Ik heb 1 ding veranderd"
    waarom: "Een test zonder aanpassing is een gesprek. Pas als je iets verandert, heb je er iets aan."

  wacht:
    titel: "Pauze"
    tekst: "Na de pauze geeft Gijs het codewoord voor de volgende stap."
    tip: "Wil je niet wachten? Test versie 0.3 alvast met dezelfde input in een nieuw gesprek."

  premortem:
    titel: "Pre-mortem"
    tijd: 12
    intro: "Stel je voor: het is over 2 maanden. Je gebruikt je werkwijze niet meer. Wat is er gebeurd?"
    hulp_titel: "Hulp: veelvoorkomende redenen"
    hulp:
      - "Ik vergat het: er was geen vast moment."
      - "Het kostte meer tijd dan het opleverde."
      - "De uitkomst was te vaak niet goed genoeg."
      - "Mijn collega's werken anders."
      - "De input die ik nodig had, mocht niet in Copilot."
      - "Mijn werk veranderde."
    meest_label: "Welke reden is het meest waarschijnlijk?"
    actie_label: "Wat doe je nu om dat te voorkomen? (1 concrete actie)"
    niet_label: "Wanneer gebruik je je werkwijze niet? (vul aan wat je vandaag leerde)"
    waarom: "Je weet vaak al waarom iets mislukt, je zegt het alleen niet hardop. Door nu de reden te benoemen, kun je er iets aan doen voordat het gebeurt."

  besluit:
    titel: "Jouw besluit"
    tijd: 10
    intro: "Wat doe je met je werkwijze? Elk besluit is goed, als je weet waarom."
    opties:
      - "Borgen: ik gebruik hem vast, alleen voor mezelf"
      - "Delen: ik deel hem met mijn team"
      - "Aanpassen: ik pas hem aan en test verder"
      - "Stoppen: hij helpt niet genoeg, ik stop ermee"
      - "Doorverwijzen: hij heeft een koppeling met een ander systeem nodig, ik geef hem door aan het AI CoE"
    waarom_label: "Waarom dit besluit?"
    veilig:
      - "Welke data gaat erin? Alleen data binnen Copilot, geen klant- of persoonsgegevens"
      - "Wie krijgt toegang? Dat weet ik"
      - "Gaat er output naar buiten zonder dat een mens kijkt? Nee"
    delen_label: "Met wie deel je hem, en waar zet je hem neer?"
    twijfel: "Twijfel? Niet delen. Vraag het eerst aan het AI CoE."
    stoppen_label: "Wat neem je mee uit deze werkwijze?"
    door_label: "Welk systeem of welke koppeling is nodig?"
    mensenwerk_label: "Dit blijft mensenwerk (neem over uit je pdf van sessie 2, pas aan als dat nodig is)"
    waarom: "Een werkwijze zonder besluit blijft liggen. Stoppen is ook een uitkomst: dan weet je waar AI voor jou niet helpt."

  proefroute:
    titel: "Je eigen proefroute"
    tijd: 12
    intro: "In 3 sessies heb je steeds dezelfde route gelopen: weten wat je wilt, proberen met AI, controleren, besluiten. Die route kun je bij elke nieuwe taak gebruiken. Maak hem nu van jezelf, en kies de taak waar je hem als eerste op probeert."
    deel1: "Welke taak is de volgende?"
    moment1_label: "Moment 1 in mijn werk waar AI misschien helpt"
    moment2_label: "Moment 2"
    tester_label: "Wat ik van de werkwijze van mijn tester ook wil proberen (uit stap 3, optioneel)"
    hulp_titel: "Hulp: laat Copilot meekijken"
    hulp_prompt: "Ik werk als {functie} bij {afdeling} van PostNL. Bekijk mijn verzonden mails en mijn agenda van de afgelopen 2 weken. Welke 3 terugkerende taken lijken op deze taak: {taak}? Geef per taak in 1 zin waarom. Noem geen klantgegevens."
    deel2: "Mijn proefroute"
    deel2_intro: "Schrijf in je eigen woorden hoe jij uitzoekt of AI helpt bij een taak. Schrijf bij elke vraag wat jij doet."
    vragen:
      - "1. Wat moet het opleveren, en voor wie? Wat zijn de 3 punten die erin moeten staan?"
      - "2. Mag het? Welke input gebruik ik, en zit daar geen klant- of persoonsgegevens in?"
      - "3. Hoe probeer ik het? (bijvoorbeeld: Copilot eerst vragen laten stellen, dan pas laten maken)"
      - "4. Hoe controleer ik het? Klopt, Past, Helpt, Mag het, en wat moest ik zelf nog doen?"
      - "5. Wanneer besluit ik? Na hoeveel keer, en wanneer stop ik?"
    keuze_label: "Op welke taak probeer ik mijn proefroute als eerste?"
    als_label: "Als ... (het moment in je werk)"
    dan_tekst: "dan probeer ik mijn proefroute op deze taak."
    waarom: "Een werkwijze helpt bij 1 taak. Een proefroute helpt bij elke taak. Je hoeft niet vooraf te weten of AI helpt: je probeert het, je controleert het en dan besluit je. Ook als het niet helpt, weet je weer iets."

  showcase:
    titel: "Naar de showcase"
    tijd: 7
    intro: "In de showcase laat je zien wat je hebt. Bereid je verhaal voor in 3 zinnen."
    werkwijze_label: "Dit is mijn werkwijze (1 zin)"
    verandert_label: "Als dit werkt, wat verandert er dan in mijn werk? (niet in uren, in je eigen woorden)"
    besluit_label: "Mijn besluit"
    plan_intro: "Je als-dan-plan voor je werkwijze. Neem het over uit je pdf van sessie 2 en pas het aan als dat nodig is."
    als_label: "Als ..."
    dan_label: "dan ..."
    teams: "Mijn werkwijze: {werkwijze}. Mijn besluit: {besluit}. Dit blijft mensenwerk: {mensenwerk}"
    afsluiting: "Zet je pdf in de map Werkwijzen in het Teams-kanaal. Wacht daarna op Gijs voor de afsluiting."
    waarom: "Wie in 3 zinnen kan vertellen wat zijn werkwijze doet en oplevert, kan hem ook aan een collega uitleggen."
