# Inhoud van de kickoff-route. Pas teksten, prompts, tijden en codewoorden hier aan.
#
# Dit bestand is de HR-pilot. Je opent het met ?pilot=hr achter de link van de app.
#
# {extern} wordt overal vervangen door de waarde van extern hieronder.
# {dataregel} wordt overal vervangen door de tekst van dataregel hieronder.
# {trainer} wordt overal vervangen door de naam bij trainer hieronder.
# In prompts vult de app {functie}, {afdeling}, {resultaat}, {stap}, {oplevert} en {punten} in.

titel: "Van resultaat naar taak"
pilot: "AI-pilot HR"
sessie: "Kickoff, deel 2"

# De externe applicatie van deze pilot, bijvoorbeeld TOPdesk. Leeg laten: "een externe applicatie".
extern: "het HR-systeem"

# Wie de sessie geeft. Leeg laten: "Gijs".
trainer: "Gijs"

dataregel: "Wat in SharePoint staat, gebruik je in Copilot. Wat in {extern} staat, gebruik je in {extern}. Zet geen persoonsgegevens of financiële gegevens van de ene applicatie in de andere. Twijfel je? Vraag het AI CoE."

# Geen codewoorden: deelnemers gaan zelf verder. Wil je ze terug, zet dan start: en verder: onder codewoorden.
codewoorden: {}

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen persoonsgegevens in deze app."
  - "Geen persoonsgegevens of financiële gegevens uit {extern} in Copilot."

start:
  tekst: "Je hebt net uitleg en 2 demo's gezien. Nu ga je zelf aan de slag, op je eigen tempo. De app heeft 5 delen."
  zo_werk_je: "Zet deze app links op je scherm en Copilot Chat rechts. Om een prompt te kopiëren ga je met je muis over het grijze vak. Rechtsboven verschijnt een kopieericoon."
  functie_label: "Mijn functie (bijvoorbeeld: HR-adviseur, recruiter, medewerker HR Services)"
  functie_hulp: "De app zet je functie en afdeling in de prompts. Vul je functie in, niet je naam."
  afdeling_label: "Mijn afdeling of team (bijvoorbeeld: HR Services, Recruitment, Learning & Development)"
  afdeling_standaard: "HR"
  waarom: "Deze route stuurt Copilot stap voor stap: eerst laten begrijpen, dan pas laten maken."

stappen:
  resultaat:
    titel: "Je resultaat"
    tijd: 5
    intro: "Denk aan iets dat regelmatig terugkomt in je werk en dat je tijd of moeite kost. Kies een concreet resultaat dat je voor jezelf of iemand anders maakt, bijvoorbeeld voor een medewerker, manager of collega."
    goed_kort: "Een goed resultaat is concreet, komt regelmatig terug en kost je nu tijd of moeite."
    goed_resultaat:
      - "komt regelmatig terug, of is steeds hetzelfde soort werk"
      - "is voor jezelf of voor een ander: een medewerker, manager, collega of andere afdeling"
      - "kost je moeite of tijd"
    te_groot: "Vragen van managers beantwoorden"
    beter: "Antwoord op de vraag die managers vaak stellen over ouderschapsverlof"
    demos:
      - "Een vacaturetekst opstellen uit de notities van een intake met een manager"
      - "Een nieuwe regeling samenvatten in 5 vragen en antwoorden voor medewerkers"
    resultaat_label: "Wat lever je regelmatig op, en voor wie?"
    extern_tekst: "Je mag ook een taak kiezen die je normaal in {extern} uitvoert. Tijdens deze oefening onderzoek je in Copilot hoe AI je bij die taak kan ondersteunen, zonder gegevens uit {extern} over te nemen."
    weet_niet_titel: "Weet je niet wat je kiest? Laat Copilot je agenda bekijken"
    weet_niet_tekst: "Kopieer deze prompt naar Copilot. Copilot kijkt in je agenda en stelt je 3 vragen. Je krijgt 5 resultaten die je regelmatig oplevert. Kies er 1."
    weet_niet_prompt: "Bekijk alleen mijn agenda van de afgelopen 2 weken, niet mijn mailbox. Stel me daarna 3 vragen, 1 tegelijk, over werk dat ik regelmatig maak. Geef dan 5 resultaten die ik regelmatig oplever, zoals antwoorden, overzichten of updates. Geef per resultaat: wat het is, voor wie, en hoe vaak ongeveer. Noem geen persoonsgegevens. Geef alleen een tabel."

  interview:
    titel: "Laat Copilot je interviewen"
    tijd: 10
    intro: "Kopieer de prompt hieronder naar Copilot Chat en laat Copilot je stap voor stap interviewen over het resultaat dat je hebt gekozen. Beantwoord de vragen één voor één. Je resultaat uit deel 1 staat al in de prompt."
    waarom_titel: "Waarom deze vragen?"
    waarom: "Copilot probeert eerst te begrijpen hoe je de taak uitvoert en waar je tegenaan loopt. Zo kan Copilot gerichter bepalen bij welke stappen AI kan ondersteunen."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL.

      Doel: ik wil uitzoeken waar Copilot mij helpt bij dit resultaat: {resultaat}. Check eerst in 1 zin of dit iets is dat regelmatig terugkomt. Zo niet, help me met maximaal 2 vragen een beter resultaat te kiezen.

      Context: interview me over de laatste keer dat ik het maakte. Vraag eerst waar het meeste gedoe zat. Vraag daarna vooral door op dat deel: wat ik deed, waar het stokte (zoeken, wachten of afstemmen), en wat ik opnieuw moest doen.

      Actie: stel 1 vraag tegelijk en zet erbij welke vraag het is, bijvoorbeeld "Vraag 2 van maximaal 8". Geef bij elke vraag een kort voorbeeld van een antwoord. Bouw voort op mijn antwoorden. Past een vraag niet bij mijn situatie, sla hem dan over. Vraag niet naar tijd of minuten. Vat na 4 vragen in 2 zinnen samen wat je begrijpt en vraag of het klopt. Noem geen persoonsgegevens.

      Verwachting: geef na maximaal 8 vragen alleen een tabel met 3 kolommen: Stap, Gedoe, Kans met Copilot (hoog of laag, met een korte reden). Maximaal 6 woorden per vakje. Alleen stappen die ik noemde, voeg er geen toe. Bedenk nog geen oplossingen.
    waarschuwing: "Vraagt Copilot naar een medewerker, een naam of een personeelsnummer? Antwoord in algemene woorden: \"een medewerker met een vraag over verlof\"."
    terug_tip: "Stelt Copilot voor om een ander resultaat te kiezen? Ga terug naar deel 1 en pas je resultaat aan. De prompts passen zich vanzelf aan."
    hulp_titel: "Loopt het gesprek met Copilot anders dan verwacht?"
    hulp_tekst: "Kopieer de prompt die bij jouw situatie past en plak hem in je gesprek met Copilot. Ga daarna verder met het interview."
    hulp:
      - label: "Ik snap de vraag niet"
        prompt: "Ik snap je vraag niet. Leg in 1 zin uit waarom je dit vraagt en geef een voorbeeld van een antwoord."
      - label: "Begrijpt Copilot mij wel?"
        prompt: "Vat in 3 zinnen samen wat je tot nu toe van mijn situatie begrijpt. Wat mis je nog over hoe het ging? Vraag niet naar tijd."
      - label: "Geen van de opties past"
        prompt: "Geen van je opties past. Het zit zo: [jouw situatie]. Ga verder met je volgende vraag."
      - label: "De tabel heeft te veel tekst"
        prompt: "Maak de tabel korter. Maximaal 6 woorden per vakje. Verander verder niets. Geef alleen de tabel."

  kies:
    titel: "Check en kies"
    tijd: 10
    intro: "Copilot heeft je stappen in een tabel gezet. Controleer eerst of die tabel klopt en kies daarna één concrete stap die je met Copilot wilt uitproberen."
    check_titel: "a. Klopt je tabel?"
    check_tekst: "Bekijk de tabel en controleer of deze weergeeft hoe je de taak de laatste keer echt hebt uitgevoerd. Mist er een stap, zoals wachten of afstemmen, of heeft Copilot iets toegevoegd dat niet klopt? Stuur Copilot dan bij met een van de prompts hieronder."
    bijsturen_titel: "Prompts om Copilot bij te sturen"
    bijsturen_tekst: "Kopieer de prompt die past en vul de [haakjes] in voordat je hem in Copilot plakt."
    bijsturen:
      - label: "Er mist een stap"
        prompt: "Je mist een stap: [stap]. Voeg hem toe op de juiste plek. Verander verder niets. Geef alleen de tabel."
      - label: "Een stap klopt niet"
        prompt: "Stap [nummer] klopt niet. Het ging zo: [wat er echt gebeurde]. Verander verder niets. Geef alleen de tabel."
      - label: "De tabel heeft te veel tekst"
        prompt: "Maak de tabel korter. Maximaal 6 woorden per vakje. Verander verder niets. Geef alleen de tabel."
      - label: "Geen tabel gekregen"
        prompt: "Zet je antwoord om in een tabel met 3 kolommen: Stap, Gedoe, Kans met Copilot. Maximaal 6 woorden per vakje. Verander verder niets. Geef alleen de tabel."
    plak_label: "Plak hier alleen de tabel uit het antwoord van Copilot. Kopieer hem met de kopieerknop onder het antwoord."
    tabel_ok: "Zo ziet je tabel eruit:"
    kies_titel: "b. Kies 1 stap"
    kies_intro: "Kies één stap uit je tabel waarbij Copilot het voorwerk kan doen en jij de uitkomst kunt controleren (Mens + AI). De kolom Kans met Copilot helpt je op weg, maar jij bepaalt uiteindelijk welke stap geschikt is om te testen."
    goed_titel: "Hier is Copilot goed in"
    goed:
      - "iets lezen en samenvatten"
      - "een eerste versie schrijven"
      - "ordenen of structureren"
      - "vergelijken"
      - "uitleggen in andere woorden"
      - "controleren tegen een instructie"
    niet_titel: "Hier helpt Copilot niet"
    niet:
      - "wachten op iemand"
      - "een besluit nemen"
      - "iets invoeren in een systeem"
    stap_label: "Welke stap wil je met Copilot uitproberen?"
    stap_hulp: "Beschrijf in woorden wat je in deze stap doet, niet het nummer uit de tabel. Bijvoorbeeld: \"De belangrijkste punten uit een HR-beleidsdocument samenvatten voor mijn antwoord aan een manager.\""
    stap_fout: "Beschrijf je stap in woorden, niet met een nummer. Copilot weet niet wat \"stap 2\" is."
    oplevert_label: "Wat moet deze stap opleveren, en voor wie?"
    oplevert_hulp: "Alleen wat deze ene stap oplevert, niet je hele resultaat."
    punten_titel: "c. Wanneer is het resultaat goed?"
    punten_label: "Mijn 3 punten"
    punten_hulp: "Bedenk drie dingen die in de uitkomst moeten staan om deze stap bruikbaar te maken. Zo kun je straks controleren of Copilot een goed resultaat oplevert. Bij een antwoord over verlof kan dat zijn: het aantal verlofdagen, de ingangsdatum en wie de aanvraag goedkeurt. Lukt het niet om 3 punten te noemen? Dan is je stap waarschijnlijk te groot."
    opdelen_titel: "Is je stap te groot? Laat Copilot alleen deze stap opdelen"
    opdelen_tekst: "Je hoeft niet terug naar het begin. Kies daarna 1 kleine stap en pas je stap bij b hierboven aan."
    opdelen_prompt: "Mijn stap is: {stap}. Hij is te groot om in 1 keer met Copilot te proberen. Deel alleen deze stap op in 3 tot 5 kleinere stappen. Maximaal 6 woorden per stap. Geef alleen de lijst."
    idee_label: "Kan je stap niet in Copilot, bijvoorbeeld omdat de gegevens in {extern} staan of er een koppeling tussen systemen nodig is? Schrijf hem op als idee voor het AI CoE. (optioneel)"

  wacht:
    titel: "Wacht op {trainer}"
    tekst: "We horen kort welke stappen jullie kozen. Ga pas verder als {trainer} het zegt."
    tip: "Klaar en tijd over? Lees je 3 punten nog 1 keer. Zijn ze concreet genoeg om de uitkomst straks aan te toetsen?"

  eerste:
    titel: "Je eerste resultaat"
    tijd: 15
    intro: "Probeer je stap nu echt, in Copilot. Je 3 punten uit deel 3 staan al klaar."
    tool_label: "In welke tool probeer je deze stap?"
    tool_opties: ["Copilot"]  # {extern} heeft nog geen AI
    tool_hulp: "Staan de gegevens die je nodig hebt in {extern}? Dan doe je de stap daar, met de AI van {extern}. Anders doe je hem in Copilot."
    punten_label: "Mijn 3 punten (uit deel 3, pas aan als dat nodig is)"
    waarom: "Copilot vraagt eerst wat ontbreekt en zegt aan het eind wat het aannam, zodat jij weet wat je moet controleren."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL.

      Doel: ik wil hulp bij deze stap: {stap}. Dit moet het opleveren: {oplevert}.

      Context: vraag me welke bronnen je mag gebruiken.

      Actie: stel me eerst maximaal 3 vragen, 1 tegelijk. Stel een open vraag als een keuze uit 2 niet past. Doe daarna de stap.

      Verwachting: dit moet er zeker in staan: {punten}. Houd het kort. Benoem aan het eind je aannames, ontbrekende informatie en wat ik zelf moet controleren.
    opbouw: "Let op de opbouw van deze prompt. Eerst je functie, die vult de app in. Dan 4 delen: Doel (wat wil je), Context (wat moet Copilot weten), Actie (hoe moet Copilot werken) en Verwachting (wat wil je terug). Die 4 delen schrijf je in sessie 2 zelf."
    bronnen_tip:
      copilot: "Vraagt Copilot welke bronnen hij mag gebruiken? Kies bewust. Gebruik alleen bronnen waar je zelf bij kunt, zoals SharePoint. Niets uit {extern}."
      extern: "Werk in {extern} alleen met het dossier waar je nu mee bezig bent. Kopieer geen persoonsgegevens of financiële gegevens uit {extern} naar Copilot of naar deze app."
    klantregel: "Gaat de tekst naar een medewerker of manager? Lees hem helemaal en check de gegevens tegen het beleid of het dossier. Een tekst van AI gaat nooit naar een ander zonder dat jij hem hebt gelezen."
    bijsturen_titel: "Niet goed genoeg? Stuur bij in 1 zin"
    bijsturen_tip: "Verander steeds 1 ding en vergelijk met het vorige antwoord. Is het beter?"
    bijsturen:
      - label: "Te algemeen"
        prompt: "Maak het specifieker voor [situatie]."
      - label: "Verkeerde toon"
        prompt: "Dit is voor [ontvanger]. Pas de toon aan."
      - label: "Twijfel of het klopt"
        prompt: "Welke aannames maak je in dit antwoord?"
      - label: "Je wilt opties"
        prompt: "Geef 2 andere versies."
      - label: "Rommelig"
        prompt: "Orden het met koppen."
      - label: "Te lang"
        prompt: "Geef alleen het resultaat, zonder advies en uitleg."
    bijsturing_label: "Welke bijsturing maakte het verschil? (leeg laten als je niet bijstuurde)"
    controle_intro: "Controleer de uitkomst. Vink aan wat klopt."
    controle:
      - "Mijn 3 punten staan erin"
      - "Klopt het? Feiten en bronnen nagekeken"
      - "Past het? Bij de ontvanger, de toon, PostNL"
      - "Helpt het? Sneller, beter, consistenter of makkelijker"
      - "Mag het? Input en output veilig"
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    herstel_label: "Wat moest je zelf nog doen voordat het bruikbaar was?"
    teams: "Mijn stap: {stap}. Tool: {tool}. Score: {score}. Wat ik nog moest doen: {herstel}"

  plan:
    titel: "Je plan"
    tijd: 5
    intro: "Plan 2 momenten deze week waarop je dit opnieuw doet, op echt werk. Zet ze nu in je agenda."
    waarom: "Pas na een paar keer op echt werk weet je of dit helpt en wat je moet aanpassen."
    tests:
      - "Test 1: dag en tijd"
      - "Test 2: dag en tijd"
    afsluiting: "Zet je pdf in de map Kickoff in het Teams-kanaal. Wacht daarna op {trainer} voor de afsluiting."
