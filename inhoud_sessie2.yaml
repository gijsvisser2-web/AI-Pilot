# Inhoud van sessie 2: Bouw je werkwijze. Pas teksten, prompts en codewoorden hier aan.
# In prompts vult de app {functie}, {afdeling}, {stap}, {oplevert}, {tests}, {herstel} en {instructie} in.
# Een sleutel met _sf erachter is de tekst voor wie zijn stap in Salesforce (Coworker) doet.
# Staat er geen _sf-versie, dan geldt de gewone tekst voor iedereen.
# Laat je het blok "tools" weg, dan werkt de app alleen met Copilot (generieke versie).

titel: "Bouw je werkwijze"
pilot: "AI-pilot Customer Care"
sessie: "Sessie 2"

codewoorden:
  start: "WERKWIJZE"
  verder: "VERSIE"

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen klantgegevens in deze app of in Copilot. Klantgegevens blijven in Salesforce."

tools:
  vraag: "Waar doe je deze stap straks in je werk?"
  opties: ["Copilot", "Salesforce (Coworker)"]
  hulp: "Heb je klant- of casegegevens nodig? Dan Salesforce. Anders Copilot. Je werkwijze ontwerp en schrijf je altijd in Copilot, zonder klantgegevens. Bij Salesforce test je hem daarna in Coworker."
  plak: ["Copilot Chat", "Coworker in Salesforce"]

start:
  tekst: "Vorige keer koos je 1 stap en testte je die. Vandaag maak je daar een vaste werkwijze van: een instructie die je zelf schrijft, test en verbetert. Houd je pdf van de kickoff bij de hand."
  zo_werk_je: "Zet deze app links op je scherm en Copilot Chat rechts. Kopieer prompts met het icoon rechtsboven in het grijze vak."
  waarom: "Een prompt die je 1 keer gebruikt, geeft elke keer iets anders. Een vaste werkwijze geeft elke keer bruikbare output."
  functie_label: "Mijn functie (bijvoorbeeld: medewerker klantenservice, specialist schade, teamleider)"
  functie_hulp: "De app zet je functie en afdeling in de prompts. Geen naam invullen."
  afdeling_label: "Mijn afdeling of team (bijvoorbeeld: Customer Care, Finance, HR)"
  afdeling_standaard: "Customer Care"
  tijdelijk_titel: "Vandaag test je in een tijdelijke chat"
  tijdelijk_tekst: "Een tijdelijke chat is een gesprek in Copilot zonder geheugen. Copilot gebruikt dan niet wat hij uit je eerdere gesprekken over je weet. Zo test je je instructie zoals een nieuwe collega hem zou gebruiken. Je opent hem in Copilot Chat bij een nieuw gesprek, via het icoon van de tijdelijke chat. Gijs laat het zien in de demo."

stappen:
  tests:
    titel: "Terug naar je tests"
    tijd: 10
    intro: "Pak je pdf van de kickoff erbij. Beschrijf je stap opnieuw, kijk hoe je tests gingen en kies hoe je verdergaat."
    waarom: "Je tests laten zien wat Copilot nog mist. Daar begint je werkwijze."
    stap_label: "Mijn stap, in woorden (staat in je pdf bij 5)"
    stap_hulp: "Schrijf wat je doet, niet het nummer. Niet: \"Stap 2\". Wel: \"De voorgeschiedenis van een klant samenvatten voor mijn antwoord\"."
    agent_hulp: "Heb je al een agent? Beschrijf de stap die je agent doet, niet \"mijn agent\". Doet hij meerdere stappen? Kies de stap waar je hem het minst vertrouwt. Die ga je vandaag breken. Elke keer dat je hem op echt werk gebruikte, telt als test."
    agent_hulp_sf: "Heb je al een agent? Beschrijf de stap die je agent doet, niet \"mijn agent\". Doet hij meerdere stappen? Kies de stap waar je hem het minst vertrouwt. Die ga je vandaag breken. Kies hieronder waar je agent draait: Copilot of Salesforce. Elke keer dat je hem op echt werk gebruikte, telt als test."
    stap_fout: "Beschrijf je stap in woorden, niet met een nummer. Copilot weet niet wat \"stap 2\" is."
    oplevert_label: "Wat levert deze stap op, en voor wie?"
    check_titel: "Is je stap concreet genoeg? Doe de check"
    check_vragen:
      - "Wat doe je precies? 1 handeling, zoals zoeken, vergelijken, samenvatten of controleren."
      - "Waarmee doe je dat? Welke informatie of bron gebruik je?"
      - "Wanneer ben je klaar? Wat ligt er dan voor je?"
    check_te_breed: "Te breed: \"Klantvragen afhandelen\". Dat is een heel proces."
    check_concreet: "Concreet: \"Een klantvraag over een vertraagd pakket samenvatten in 3 regels, als start voor mijn antwoord\". 1 handeling, 1 bron, en je weet wanneer je klaar bent."
    check_prompt_intro: "Kom je er niet uit? Laat Copilot meedenken."
    check_prompt: "Ik werk als {functie} bij {afdeling} van PostNL. Ik wil 1 concrete werkstap kiezen om met AI te verbeteren. Mijn stap is nu: {stap}. Dit moet hij opleveren: {oplevert}. Controleer of dit 1 handeling is, of eigenlijk meerdere stappen of een eindresultaat. Is het te breed? Stel me dan maximaal 3 vragen, 1 tegelijk, om de stap kleiner te maken. Geef daarna een voorstel voor mijn stap in woorden, en wat die stap oplevert en voor wie. Kies niet voor mij. Noem geen klantgegevens."
    oplevert_hulp: "Alleen het resultaat van deze ene stap, niet het eindresultaat van je hele werk. Bijvoorbeeld: \"een overzicht van eerdere afspraken, voor mijn coachgesprek\"."
    hoe_vaak: "Hoe vaak deed je je stap op echt werk sinds de kickoff?"
    hoe_vaak_opties: ["0 keer", "1 keer", "2 keer", "3 keer of vaker"]
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    opbrengst: ["Sneller", "Beter", "Consistenter", "Makkelijker", "Geen voordeel"]
    niet_getest: "Niet getest? Geen probleem, dat geldt voor veel mensen. Je gebruikt vandaag je eerste resultaat uit de kickoff. Je test alsnog in stap 4."
    waarom_niet: ["Geen tijd", "Vergeten", "Wist niet hoe", "Geen geschikte taak voorbijgekomen", "Anders"]
    kickoff_label: "Je eerste resultaat uit de kickoff: score en wat je zelf nog moest doen (staat in je pdf bij 6)"
    verder_opties:
      - "Doorgaan: mijn stap werkt, ik maak er een vaste werkwijze van"
      - "Aanpassen: mijn stap werkt deels, ik maak hem kleiner of anders"
      - "Andere stap: deze stap past niet, ik kies een andere uit mijn tabel"
      - "Doorverwijzen: mijn stap kan niet in Copilot of Coworker, er is een koppeling met een ander systeem nodig"
    aanpassen_tekst: "Laat Copilot je helpen de stap kleiner of anders te maken. Pas daarna het veld Mijn stap hierboven aan."
    aanpassen_prompt: "Ik werk als {functie} bij {afdeling} van PostNL. Ik wil AI gebruiken bij deze stap: {stap}. Het werkte deels. Dit moest ik zelf nog doen: {herstel}. Help me de stap kleiner of anders te maken. Stel me eerst maximaal 3 vragen, 1 tegelijk. Geef daarna 2 opties: een kleinere versie van de stap en een andere aanpak. Kies niet voor mij. Noem geen klantgegevens."
    andere_tekst: "Pak je tabel uit de pdf (bij 2 en 3). Laat Copilot meedenken over een betere stap. Pas daarna het veld Mijn stap hierboven aan."
    andere_prompt: "Ik werk als {functie} bij {afdeling} van PostNL. Dit zijn de stappen van een taak die ik regelmatig doe: [plak je tabel uit de pdf]. Ik koos eerst deze stap: {stap}. Die past niet, omdat: [waarom]. Welke 2 stappen passen beter om met AI te proberen? Leg per stap in 1 zin uit waarom. Kies niet voor mij. Noem geen klantgegevens."
    door_tekst: "Schrijf je idee op. Het komt in je pdf en gaat naar het AI CoE. Kies daarna een andere stap uit je tabel die wel kan, en pas het veld Mijn stap hierboven aan."
    door_label: "Mijn idee voor het AI CoE: welk systeem of welke koppeling is nodig?"
    vinkjes_intro: "Klaar? Zet het vinkje en ga verder."
    vinkje: "Ik heb mijn stap in woorden beschreven en gekozen hoe ik verderga"

  ontwerp:
    titel: "Schrijf je instructie"
    tijd: 15
    intro: "Zie Copilot als een nieuwe collega in je team. Wil je dat hij meewerkt, dan moet je hem informeren. Schrijf in je eigen woorden wat hij moet weten. De rol vult de app zelf in met je functie. Kort mag. De app maakt er 1 instructie van."
    bestaand_vraag: "Heb je voor deze stap al een instructie of een agent die je gebruikt?"
    bestaand_opties: ["Nee, ik schrijf hem nu", "Ja, ik heb al een instructie of agent"]
    bestaand_tekst: "Zet je bestaande instructie in de 4 velden hieronder. Weet je niet wat waar hoort? Laat Copilot hem verdelen met de prompt hieronder. In stap 3 kijkt Copilot er kritisch naar."
    bestaand_prompt: "Dit is mijn instructie voor Copilot: [plak je instructie]. Verdeel hem onder 4 kopjes: Doel, Context, Actie, Verwachting. Verander niets aan de inhoud. Past iets nergens onder, zet het dan onder een 5e kopje: Overig. Voer de instructie niet uit."
    waarom: "Straks is er geen app. Wie zelf een instructie kan schrijven, kan Copilot ook maandag aan het werk zetten."
    vast_titel: "Loop je vast? Laat Copilot je interviewen"
    vast_tekst: "Weet je niet wat je moet invullen? Plak deze prompt in een tijdelijke chat. Copilot stelt je vragen. Neem daarna alleen over wat jij zei."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL. Ik wil van deze stap een vaste werkwijze maken: {stap}. Dit moet het opleveren: {oplevert}. Zo gingen mijn tests: {tests}.

      Interview me. Stel 1 vraag tegelijk en zet erbij welke vraag het is, bijvoorbeeld "Vraag 2 van maximaal 5". Geef bij elke vraag een kort voorbeeld van een antwoord. Bouw voort op mijn antwoorden.

      Onderwerpen: wat de stap oplevert en voor wie, welke informatie ik elke keer heb, wat Copilot moet doen en in welke volgorde, en hoe het resultaat eruit moet zien. Vraag ook of een deel van deze stap beter een vaste regel is (altijd hetzelfde, zonder afweging, bijvoorbeeld een formule in Excel) dan werk voor AI.

      Noem geen klantgegevens. Vraag niet naar tijd.

      Geef na maximaal 5 vragen alleen een overzicht met 4 kopjes: Doel, Context, Actie, Verwachting. Maximaal 2 regels per kopje. Gebruik alleen wat ik zei.
    prompt_sf: |-
      Ik werk als {functie} bij {afdeling} van PostNL. Ik wil van deze stap een vaste werkwijze maken: {stap}. Dit moet het opleveren: {oplevert}. Zo gingen mijn tests: {tests}. Ik gebruik de instructie straks in Coworker, de AI in Salesforce, bij een echte case.

      Interview me. Stel 1 vraag tegelijk en zet erbij welke vraag het is, bijvoorbeeld "Vraag 2 van maximaal 5". Geef bij elke vraag een kort voorbeeld van een antwoord. Bouw voort op mijn antwoorden.

      Onderwerpen: wat de stap oplevert en voor wie, welke gegevens uit de case ik elke keer nodig heb, wat Coworker moet doen en in welke volgorde, en hoe het resultaat eruit moet zien. Vraag ook of een deel van deze stap beter een vaste regel is (altijd hetzelfde, zonder afweging) dan werk voor AI.

      Noem geen klantgegevens. Vraag niet naar tijd.

      Geef na maximaal 5 vragen alleen een overzicht met 4 kopjes: Doel, Context, Actie, Verwachting. Maximaal 2 regels per kopje. Gebruik alleen wat ik zei.
    hulp_vraag: "Wat heb je gebruikt?"
    hulp_opties: ["Alleen de voorbeelden bij de velden", "Het interview met Copilot"]
    waarschuwing: "Vraagt Copilot naar een klant? Antwoord in algemene woorden: \"een klant met een vraag over een pakket\"."

  instructie:
    titel: "Laat Copilot meekijken"
    tijd: 18
    intro: "Je instructie is af. Laat Copilot er nu als coach naar kijken: wat mist een nieuwe collega die jouw werk niet kent? Daarna schrijf je op wat jij zelf blijft doen."
    coach_titel: "a. Laat Copilot meekijken als coach"
    coach_tekst: "Plak deze prompt in een tijdelijke chat. Je instructie staat er al in."
    coach_prompt: |-
      Kijk als coach mee naar mijn instructie voor Copilot. Voer de instructie niet uit.

      Mijn stap: {stap}.

      Mijn instructie:
      {instructie}

      Lees hem alsof je een nieuwe collega bent die mijn werk niet kent. Wat ontbreekt of is onduidelijk? Kijk naar Doel, Context, Actie en Verwachting. Noem maximaal 3 punten, het belangrijkste eerst. Geef bij elk punt een vraag die ik mezelf kan stellen. Schrijf geen nieuwe versie. Ik pas hem zelf aan. Noem geen klantgegevens.
    coach_prompt_sf: |-
      Kijk als coach mee naar mijn instructie voor Coworker, de AI in Salesforce. Voer de instructie niet uit.

      Mijn stap: {stap}.

      Mijn instructie:
      {instructie}

      Lees hem alsof je een nieuwe collega bent die mijn werk niet kent. Wat ontbreekt of is onduidelijk? Kijk naar Doel, Context, Actie en Verwachting. Noem maximaal 3 punten, het belangrijkste eerst. Geef bij elk punt een vraag die ik mezelf kan stellen. Schrijf geen nieuwe versie. Ik pas hem zelf aan. Noem geen klantgegevens.
    aanpas_titel: "b. Pas je instructie aan"
    coach_label: "Welk punt van Copilot neem je over? Niets? Schrijf dan waarom niet."
    aanpas_tekst: "Pas hieronder aan wat nodig is. Neem alleen over wat klopt voor jouw werk."
    jij_titel: "c. Voor jou, niet voor Copilot"
    jij_tekst: "Deze 3 vragen gaan niet in je instructie. Ze komen in je pdf. Zo weet jij, en straks een collega, wat je altijd zelf doet."
    velden:
      doel: "Doel: wat lever je op, en voor wie? Bijvoorbeeld: \"een concept voor een klantantwoord, dat ik zelf naar de klant stuur\""
      input: "Context: wat geef je Copilot elke keer mee, en waar komt het vandaan? Bijvoorbeeld: \"de vraag van de klant in algemene woorden, en de werkinstructie over vertraagde pakketten\""
      aanpak: "Actie: wat moet Copilot doen, en in welke volgorde? Bijvoorbeeld: \"1. Vat de vraag samen. 2. Zoek het antwoord in de werkinstructie. 3. Schrijf een concept.\""
      output: "Verwachting: hoe ziet het resultaat eruit? Lengte, opbouw en toon. Bijvoorbeeld: \"maximaal 8 regels, je-vorm, vriendelijk, sluit af met wat de klant nu kan doen\""
    velden_sf:
      doel: "Doel: wat lever je op, en voor wie? Bijvoorbeeld: \"een samenvatting van de case, voor mijn collega die hem overneemt\""
      input: "Context: welke gegevens uit de case moet Coworker gebruiken? Bijvoorbeeld: \"de laatste 3 contactmomenten en de status van de zending\""
      aanpak: "Actie: wat moet Coworker doen, en in welke volgorde? Bijvoorbeeld: \"1. Zet de contactmomenten op volgorde. 2. Noem wat is afgesproken. 3. Noem wat nog openstaat.\""
      output: "Verwachting: hoe ziet het resultaat eruit? Lengte, opbouw en toon. Bijvoorbeeld: \"maximaal 6 regels, met kopjes Afspraken en Open\""
    controle_label: "Mijn controle: wat check ik altijd aan de uitkomst voordat ik hem gebruik? Bijvoorbeeld: \"kloppen de feiten en cijfers met de bron?\" (komt in je pdf, niet in de instructie)"
    niet_label: "Wanneer gebruik ik de uitkomst niet? Bijvoorbeeld: \"als er informatie ontbreekt\", \"als de situatie afwijkt van normaal\" of \"als er een besluit met grote gevolgen aan hangt\". Zo weten jij en straks een collega waar de grens ligt, en gaat er geen fout resultaat verder. (komt in je pdf, niet in de instructie)"
    mensenwerk_label: "Dit blijft mensenwerk: wat beslis of doe ik altijd zelf? Bijvoorbeeld: \"versturen\", \"een toezegging doen\" of \"een uitzondering maken\""
    sjabloon: "Ik werk als {functie} bij {afdeling} van PostNL. Doel: {doel}. Context: {input}. Actie: {aanpak}. Verwachting: {output}. Ontbreekt er informatie? Stel dan eerst maximaal 2 vragen, 1 tegelijk. Noem geen klantgegevens. Benoem aan het eind je aannames, ontbrekende informatie en wat ik zelf moet controleren."
    sjabloon_sf: "Ik werk als {functie} bij {afdeling} van PostNL. Doel: {doel}. Context, gebruik uit deze case: {input}. Actie: {aanpak}. Verwachting: {output}. Gebruik alleen gegevens die in de case staan. Verzin geen gegevens. Ontbreekt er informatie? Zeg dan wat er ontbreekt. Benoem aan het eind je aannames en wat ik zelf moet controleren."
    kleur_vraag: "Mag het? Kies 1 kleur voor de input die je gaat gebruiken"
    kleuren:
      - "Groen: data binnen Copilot waar ik zelf bij kan, ook informatie over collega's. Geen klantgegevens."
      - "Oranje: ik twijfel"
      - "Rood: klantgegevens, of data van buiten Copilot"
    kleuren_sf:
      - "Groen: ik test in Coworker, op de case waar ik mee bezig ben. In Copilot gebruik ik geen klantgegevens."
      - "Oranje: ik twijfel"
      - "Rood: ik wil klantgegevens in Copilot gebruiken"
    groen: "Ga door."
    oranje: "Zoek het uit met Copilot of vraag het AI CoE. Test vandaag met een verzonnen voorbeeld."
    rood: "Niet gebruiken. Laat Copilot een verzonnen voorbeeld maken, of kies andere input of een andere stap."
    rood_sf: "Niet in Copilot. Klantgegevens blijven in Salesforce. Test met Coworker op de case, of laat Copilot een verzonnen voorbeeld maken."
    uitzoeken_prompt: "Ik wil deze soort input gebruiken voor een taak: [beschrijf de input, plak geen echte gegevens]. Zitten hier klantgegevens in? Leg in 3 zinnen uit waarom wel of niet. Wat kan ik weglaten of algemeen maken?"
    uitzoeken_noot: "Twijfel je daarna nog? Vraag het AI CoE. Copilot helpt je nadenken, maar beslist niet wat mag."
    verzonnen_prompt: "Maak 1 verzonnen voorbeeld van [soort input, bijvoorbeeld: een klantmail over een beschadigd pakket] voor mijn werk als {functie} bij {afdeling}. Gebruik geen echte namen, adressen, telefoonnummers of zendingnummers. Maak het realistisch, maar duidelijk verzonnen."
    rood_vinkje: "Ik gebruik een verzonnen voorbeeld of andere input"
    vinkje_intro: "Lees je instructie nog 1 keer. Klopt hij? Zet dan het vinkje."
    vinkje: "Een collega snapt deze instructie zonder uitleg van mij"
    waarom: "Een instructie die je zelf schrijft, kun je ook zelf verbeteren en uitleggen aan een collega."

  wacht:
    titel: "Pauze"
    tekst: "Na de pauze geeft Gijs het codewoord voor de volgende stap."
    tip: "Wil je niet wachten? Plak je instructie alvast in een tijdelijke chat in Copilot en kijk wat er gebeurt."
    tip_sf: "Wil je niet wachten? Open Coworker bij een case en plak je instructie. Kijk wat er gebeurt."

  test:
    titel: "Test je instructie op een gewoon voorbeeld"
    tijd: 12
    intro: "Je instructie staat klaar: zelf geschreven of je bestaande. Nu kijk je of hij werkt als je stap echt voorkomt in je werk. Dat doe je in 5 korte stappen, a tot en met e."
    stap1_titel: "a. Kies 1 gewoon voorbeeld van je stap"
    stap1_tekst: "Denk aan 1 keer dat je stap voorkwam, bijvoorbeeld deze week. Dat voorbeeld is de input die je straks aan Copilot geeft. Kies een gewoon voorbeeld, niet het moeilijkste. Dat komt in stap 5. Gebruik geen klantgegevens: maak het algemeen of verzin een voorbeeld dat erop lijkt."
    stap1_tekst_sf: "Kies 1 gewone case in Salesforce waar je stap bij voorkomt, bijvoorbeeld een case waar je nu mee bezig bent. Die case is je input. Niet de moeilijkste. Die komt in stap 5."
    stap2_titel: "b. Wat moet er zeker in het resultaat staan?"
    punten_label: "Schrijf 1 tot 3 punten op"
    punten_waarom: "Doe dit voordat je Copilot opent. Dan beoordeel je straks op inhoud, en niet op \"het ziet er goed uit\"."
    stap3_titel: "c. Plak je instructie in een tijdelijke chat"
    stap3_titel_sf: "c. Plak je instructie in Coworker"
    stap3_tekst: "Open in Copilot een tijdelijke chat. Geen tijdelijke chat? Open dan een nieuw gesprek. Plak je instructie."
    stap3_tekst_sf: "Open Coworker bij je case. Plak je instructie."
    waarom: "Waarom een tijdelijke chat? Met geheugen aan onthoudt Copilot dingen uit je eerdere gesprekken, ook in een nieuw gesprek. Een tijdelijke chat gebruikt dat geheugen niet. Zo werkt je instructie zoals bij een nieuwe collega die jouw werk nog niet kent."
    waarom_sf: "Waarom zo? Coworker kent je gesprekken in Copilot niet. Zo test je of je instructie op zichzelf werkt, zoals straks in je echte werk."
    stap4_titel: "d. Geef je input en lees de uitkomst"
    stap5_titel: "e. Beoordeel de uitkomst"
    waarschuwing: "Geen klantgegevens in Copilot. Maak het algemeen of verzin een voorbeeld dat erop lijkt."
    waarschuwing_sf: "Werk in Coworker alleen met de case waar je nu mee bezig bent. Kopieer niets uit de case naar Copilot of naar deze app."
    bijsturen_tekst: "Niet goed genoeg? Typ eerst zelf in 1 zin wat er beter moet. Verander steeds 1 ding en vergelijk met het vorige antwoord."
    bijsturen_titel: "Hulp: zinnen om bij te sturen"
    bijsturen:
      - label: "Te algemeen"
        prompt: "Maak het specifieker voor [situatie]."
      - label: "Verkeerde toon"
        prompt: "Dit is voor [ontvanger]. Pas de toon aan."
      - label: "Twijfel of het klopt"
        prompt: "Welke aannames maak je in dit antwoord?"
      - label: "Je wilt opties"
        prompt: "Geef 2 andere versies."
      - label: "Rommelig"
        prompt: "Orden het met koppen."
      - label: "Te lang"
        prompt: "Geef alleen het resultaat, zonder advies en uitleg."
    bijsturing_label: "Welke bijsturing maakte het verschil? (leeg laten als je niet bijstuurde)"
    hulp_opties: ["Geen", "Bijstuurzinnen"]
    vinkjes_intro: "Controleer de uitkomst. Vink aan wat klopt."
    controle:
      - "Mijn punten staan erin"
      - "Klopt het? Feiten en bronnen nagekeken"
      - "Past het? Bij de ontvanger, de toon, PostNL"
      - "Helpt het? Sneller, beter, consistenter of makkelijker"
      - "Mag het? Input en output veilig"
    klantregel: "Gaat de tekst naar een klant? Lees hem helemaal en check de gegevens tegen de case. Een tekst van AI gaat nooit naar een klant zonder dat jij hem hebt gelezen."
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    herstel_label: "Wat moest je zelf nog doen voordat het bruikbaar was?"

  breek:
    titel: "Test je instructie op een lastig voorbeeld"
    tijd: 12
    intro: "Bij een gewoon voorbeeld werkt bijna elke instructie. Nu zoek je de grens: wat gebeurt er op een drukke dag, met lastige input? Dat doe je in 5 korte stappen, a tot en met e."
    stap1_titel: "a. Laat Copilot 3 lastige voorbeelden maken"
    stap1_tekst: "Kopieer de prompt en plak hem in Copilot. Je instructie staat er al in. Copilot maakt 3 verzonnen voorbeelden en zegt bij elk wat een goed antwoord zou doen."
    stap1_titel_sf: "a. Laat Copilot meedenken: wat maakt een case lastig?"
    stap1_tekst_sf: "Kopieer de prompt en plak hem in Copilot. Copilot noemt 3 soorten lastige cases, zonder gegevens, en zegt bij elk wat een goed antwoord zou doen."
    prompt: |-
      Dit is mijn instructie: {instructie}

