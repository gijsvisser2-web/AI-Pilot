# Inhoud van de kickoff-route. Pas teksten, prompts, tijden en codewoorden hier aan.
# In prompts worden {resultaat}, {stap}, {oplevert} automatisch ingevuld.

titel: "Van resultaat naar taak"
pilot: "AI-pilot Customer Care"
sessie: "Kickoff, deel 2"

codewoorden:
  start: "COPILOT"
  verder: "PROMPT"

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen klantgegevens in deze app of in Copilot."

start:
  tekst: "Je hebt net uitleg en 2 demo's gezien. Nu ga je zelf aan de slag, op je eigen tempo. Elke stap heeft 1 actie. Pas als je die hebt gedaan, ga je door."
  zo_werk_je: "Zet deze app links op je scherm en Copilot Chat rechts. Kopieer prompts met het icoon rechtsboven in het grijze vak."
  functie_label: "Mijn functie (bijvoorbeeld: medewerker klantenservice, specialist schade, teamleider)"
  functie_hulp: "De app zet je functie en afdeling in de prompts. Geen naam invullen."
  afdeling_label: "Mijn afdeling of team (bijvoorbeeld: Customer Care, Finance, HR)"
  afdeling_standaard: "Customer Care"
  waarom: "Deze route stuurt Copilot stap voor stap: eerst laten begrijpen, dan pas laten maken."

stappen:
  resultaat:
    titel: "Je resultaat"
    tijd: 5
    intro: "Kies iets dat je regelmatig oplevert aan iemand anders. Denk aan de laatste keer dat je het maakte."
    goed_resultaat:
      - "komt minstens elke maand terug, of is steeds hetzelfde soort werk"
      - "gaat naar iemand anders: klant, collega, leidinggevende of andere afdeling"
      - "kost je moeite of tijd"
      - "kun je in Copilot oefenen zonder klant- of persoonsgegevens"
    te_groot: "Klantvragen beantwoorden"
    beter: "Antwoord op een vraag over een vertraagd internationaal pakket"
    demos:
      - "Een mail aan Insurance opstellen met alle gegevens van een schadegeval"
      - "Een brief van een klant samenvatten en 3 mogelijke reacties voorstellen"
    demo_noot: "Werk je met AI binnen Salesforce? Dan blijven de klantgegevens in Salesforce. In Copilot gebruik je geen klantgegevens uit Salesforce."
    salesforce: "Werk je vooral in Salesforce? Dan mag je resultaat daar ook over gaan. Stap 1 tot 5 doe je in Copilot: je vertelt hoe je werkt, niet over klanten. FAQ's en werkinstructies mogen in Copilot, klant- en persoonsgegevens niet. In stap 6 probeer je je stap in de tool die past. Heb je klant- of casegegevens nodig? Dan doe je die stap in Salesforce."
    vinkjes_intro: "Past je resultaat bij deze 2 punten? Zet dan beide vinkjes. Pas daarna kun je verder."
    vinkjes:
      - "Ik maak dit regelmatig, voor iemand anders"
      - "In deze app en in Copilot gebruik ik geen klant- of persoonsgegevens. Klantgegevens blijven in Salesforce."
    weet_niet_titel: "Weet je niet wat je kiest? Laat Copilot je agenda bekijken"
    weet_niet_tekst: "Kopieer deze prompt naar Copilot. Copilot kijkt in je agenda en stelt je 3 vragen. Je krijgt 5 resultaten die je regelmatig oplevert. Kies er 1."
    weet_niet_prompt: "Bekijk alleen mijn agenda van de afgelopen 2 weken, niet mijn mailbox. Stel me daarna 3 vragen, 1 tegelijk, over werk dat ik regelmatig voor anderen maak. Geef dan 5 resultaten die ik regelmatig oplever, zoals antwoorden, overzichten of updates. Geef per resultaat: wat het is, voor wie, en hoe vaak ongeveer. Noem geen klantgegevens. Geef alleen een tabel."
  interview:
    titel: "Laat Copilot je interviewen"
    tijd: 10
    intro: "Kopieer de prompt hieronder met het icoon rechtsboven in het grijze vak. Plak hem in Copilot Chat. Beantwoord de vragen 1 voor 1. Jouw resultaat staat er al in."
    waarom: "Copilot stelt eerst vragen, zodat het hoort wat niet in je mails of bestanden staat: hoe jij dit werk doet en waar het vastloopt."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL. Ik wil onderzoeken waar AI mij helpt bij dit resultaat: {resultaat}. Check eerst in 1 zin of dit iets is dat ik regelmatig voor een ander maak. Zo niet, help me met maximaal 2 vragen een beter resultaat te kiezen.

      Interview me daarna over de laatste keer dat ik het maakte. Stel 1 vraag tegelijk en zet erbij welke vraag het is, bijvoorbeeld "Vraag 2 van maximaal 8". Geef bij elke vraag een kort voorbeeld van een antwoord. Bouw voort op mijn antwoorden. Past een vraag niet bij mijn situatie, sla hem dan over. Vraag 1 keer door bij de stap die de meeste moeite kostte. Vraag niet naar tijd of minuten.

      Onderwerpen: wat ik eerst deed, wat daarna, waar het stokte (zoeken, wachten of afstemmen), en wat ik die keer opnieuw moest doen.

      Vat na 4 vragen in 2 zinnen samen wat je begrijpt en vraag of het klopt. Herhaal geen eerdere tabellen. Noem geen klantgegevens.

      Geef na maximaal 8 vragen alleen een tabel: stap, wat ik deed, waar het moeite kostte. Alleen stappen van die ene keer. Bedenk nog geen oplossingen.
    waarschuwing: "Vraagt Copilot naar een klant of een klantnummer? Antwoord in algemene woorden: \"een klant met een vraag over een pakket\"."
    terug_tip: "Stelt Copilot voor om een ander resultaat te kiezen? Ga terug naar stap 1 en pas het aan. De prompts passen zich vanzelf aan."
    hulp:
      - label: "Ik snap de vraag niet"
        prompt: "Ik snap je vraag niet. Leg in 1 zin uit waarom je dit vraagt en geef een voorbeeld van een antwoord."
      - label: "Begrijpt Copilot mij wel?"
        prompt: "Vat in 3 zinnen samen wat je tot nu toe van mijn situatie begrijpt. Wat mis je nog over hoe het ging? Vraag niet naar tijd."
      - label: "Geen van de opties past"
        prompt: "Geen van je opties past. Het zit zo: [jouw situatie]. Ga verder met je volgende vraag."
    opbouw: "Let op de opbouw van deze prompt: wie je bent, wat je wilt, hoe Copilot moet werken en wat je terug wilt. Die 4 delen schrijf je in sessie 2 zelf."
    vinkje_intro: "Klaar met het interview? Staan je stappen in een tabel in Copilot? Zet dan het vinkje en ga naar de volgende stap. Daar controleer je de tabel."
    vinkje: "Copilot heeft mijn stappen in een tabel gezet"
  check:
    titel: "Check je tabel"
    tijd: 4
    intro: "Copilot schreef op wat jij vertelde. Klopt het ook? Jij kent je werk, Copilot niet."
    waarom: "Copilot vult gaten soms zelf in, en een fout die je nu laat staan komt terug in elke volgende stap."
    vinkjes_intro: "Kijk je tabel na. Zet een vinkje als het klopt. Klopt iets niet? Stuur eerst bij met een prompt hieronder."
    vinkjes:
      - "De volgorde klopt: zo ging het echt, niet zoals het zou moeten"
      - "Er mist geen stap. Vaak vergeten: wachten op iemand, afstemmen, zelf controleren"
      - "Er staat niets in dat ik niet zei"
    bijsturen:
      - "Je mist een stap: [stap]. Voeg hem toe op de juiste plek. Verander verder niets. Geef alleen de tabel."
      - "Stap [nummer] klopt niet. Het ging zo: [wat er echt gebeurde]. Verander verder niets. Geef alleen de tabel."
    plak_label: "Plak hier je tabel (kopieer hem met de kopieerknop onder het antwoord van Copilot)"
  wiedoetwat:
    titel: "Wie doet wat?"
    tijd: 5
    intro: "Laat Copilot een eerste indeling maken. Daarna beoordeel jij."
    waarom: "Copilot zet snel te veel op AI, dus hier oefen je het belangrijkste: weten wanneer AI wel en niet past."
    vuistregel: "Welke tool? Heb je klant- of casegegevens nodig: Salesforce. Ga je denken, schrijven of werken met je eigen bestanden en interne informatie: Copilot."
    prompt: "Zet bij elke stap uit de tabel: Mens, Mens + AI of AI, met 1 zin uitleg. Zet er een kolom Tool bij. Kies Salesforce als de stap klant- of casegegevens nodig heeft. Kies Copilot voor denken, schrijven en werken met eigen bestanden en interne informatie. Kies - bij een Mens-stap. Twijfel je of er klantgegevens in een stap zitten? Zet er 'Check' bij. Ik beslis zelf. Geef alleen de tabel."
    controle_intro: "Loop de indeling en de tool van Copilot langs. Vul alleen in wat voor jou geldt."
    oordeel_vraag: "Hoe vind je de indeling van Copilot?"
    oordelen: ["Eens met alles", "Bij minimaal 1 stap niet eens"]
    stap_label: "Bij welke stap niet? Schrijf de naam van de stap, niet het nummer. Meer stappen? Kies de belangrijkste."
    indelingen: ["Mens", "Mens + AI in Copilot", "Mens + AI in Salesforce", "AI in Copilot", "AI in Salesforce"]
    copilot_vraag: "Copilot zei"
    ik_vraag: "Ik zeg"
    waarom_label: "Waarom? (1 zin)"
    mensstap_label: "Wat is je Mens-stap? Daar beoordeel jij of het resultaat goed is. (naam van de stap)"
    teams_oneens: "Mijn resultaat: {resultaat}. Bij de stap '{stap}' zei Copilot {copilot}, ik zeg {ik}. Waarom: {waarom}"
    teams_eens: "Mijn resultaat: {resultaat}. Ik was het eens met de indeling van Copilot. Mijn Mens-stap: {mensstap}"
  wacht:
    titel: "Wacht op Gijs"
    tekst: "We bespreken kort wat jullie zagen. Daarna geeft Gijs het codewoord voor de volgende stap."
    tip: "Klaar en tijd over? Zet je zin uit stap 4 in de draad in het Teams-kanaal."
  kies:
    titel: "Kies 1 stap"
    tijd: 3
    intro: "Kies de stap waarmee je deze week gaat experimenteren."
    waarom: "1 stap kun je testen en verbeteren, een heel proces niet, en wat je hier invult komt in de prompt van stap 6."
    vinkjes_intro: "Check of je stap past. Zet de vinkjes als het klopt."
    stap_label: "Mijn stap"
    oplevert_label: "Wat moet deze stap opleveren?"
    vinkjes:
      - "Deze stap kost nu moeite"
      - "Het is een AI- of Mens + AI-stap"
      - "Mag het: klant- of casegegevens gebruik ik alleen in Salesforce, niet in Copilot"
    past_niet: "Past je stap niet? Kies een andere stap uit je tabel. Heeft de stap klantgegevens nodig? Dan doe je hem in stap 6 in Salesforce. Kan hij in geen van beide tools, bijvoorbeeld omdat er een koppeling tussen systemen nodig is? Schrijf hem hieronder op als idee voor het AI CoE. Dan staat hij in je pdf."
    idee_label: "Idee voor het AI CoE (optioneel)"
  eerste:
    titel: "Je eerste resultaat"
    tijd: 15
    intro: "Probeer je stap nu echt, in de tool die bij je stap past. Denk eerst zelf na: wat moet er in het resultaat staan? Open dan pas de tool."
    tool_label: "In welke tool probeer je deze stap?"
    tool_opties: ["Copilot", "Salesforce"]
    tool_hulp: "Klant- of casegegevens nodig: Salesforce. Anders: Copilot. Zie je indeling uit stap 4."
    punten_label: "Schrijf 3 punten op die zeker in het resultaat moeten staan"
    punten_hulp: "Bijvoorbeeld: het schadebedrag, de datum van verzending, een vraag om bewijs. De app zet je punten in de prompt."
    waarom: "Copilot vraagt eerst wat ontbreekt en zegt aan het eind wat het aannam, zodat jij weet wat je moet controleren."
    vinkjes_intro: "Controleer de uitkomst. Vink aan wat klopt."
    prompt: "Ik werk als {functie} bij {afdeling} van PostNL. Ik wil hulp bij deze stap: {stap}. Dit moet het opleveren: {oplevert}. Dit moet er zeker in staan: {punten}. Stel me eerst maximaal 3 vragen, 1 tegelijk. Stel een open vraag als een keuze uit 2 niet past. Vraag ook welke bronnen je mag gebruiken. Doe daarna de stap. Houd het kort. Benoem je aannames, ontbrekende informatie en wat ik zelf moet controleren."
    bronnen_tip:
      Copilot: "Vraagt Copilot welke bronnen hij mag gebruiken? Kies bewust. Geen mailbox met klantmails."
      Salesforce: "Werk in Salesforce alleen met de case waar je nu mee bezig bent. Klantgegevens kopieer je niet naar Copilot of naar deze app."
    klantregel: "Gaat de tekst naar een klant? Lees hem helemaal en check de gegevens tegen de case. Een tekst van AI gaat nooit naar een klant zonder dat jij hem hebt gelezen."
    bijsturen_titel: "Niet goed genoeg? Stuur bij in 1 zin"
    bijsturen_tip: "Verander steeds 1 ding en vergelijk met het vorige antwoord. Is het beter?"
    bijsturen:
      - label: "Te algemeen"
        prompt: "Maak het specifieker voor [situatie]."
      - label: "Verkeerde toon"
        prompt: "Dit is voor [ontvanger]. Pas de toon aan."
      - label: "Twijfel of het klopt"
        prompt: "Welke aannames maak je in dit antwoord?"
      - label: "Je wilt opties"
        prompt: "Geef 2 andere versies."
      - label: "Rommelig"
        prompt: "Orden het met koppen."
      - label: "Te lang"
        prompt: "Geef alleen het resultaat, zonder advies en uitleg."
    bijsturing_label: "Welke bijsturing maakte het verschil? (leeg laten als je niet bijstuurde)"
    controle:
      - "Mijn 3 punten staan erin"
      - "Klopt het? Feiten, bronnen en klantgegevens nagekeken (tegen de case)"
      - "Past het? Bij de ontvanger, de toon, PostNL"
      - "Helpt het? Sneller, beter, consistenter of makkelijker"
      - "Mag het? Input en output veilig"
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    herstel_label: "Wat moest je zelf nog doen voordat het bruikbaar was?"
    teams: "Mijn stap: {stap}. Tool: {tool}. Score: {score}. Wat ik nog moest doen: {herstel}"
  plan:
    titel: "Je plan"
    tijd: 5
    intro: "Plan 3 momenten deze week waarop je dit opnieuw doet, op echt werk. Zet ze nu in je agenda."
    waarom: "Pas na een paar keer op echt werk weet je of dit helpt en wat je moet aanpassen."
    afsluiting: "Zet je pdf in de map Kickoff in het Teams-kanaal. Wacht daarna op Gijs voor de afsluiting."
