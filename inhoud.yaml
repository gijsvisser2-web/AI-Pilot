# Inhoud van de kickoff-route. Pas teksten, prompts, tijden en codewoorden hier aan.
#
# 1 bestand per pilot. Dit bestand is Customer Care. Een andere pilot krijgt een kopie
# met de naam inhoud_<pilot>.yaml, bijvoorbeeld inhoud_hr.yaml. Die kies je met
# ?pilot=hr achter de link van de app. Zonder ?pilot= laadt de app dit bestand.
#
# {extern} wordt overal vervangen door de waarde van extern hieronder.
# {dataregel} wordt overal vervangen door de tekst van dataregel hieronder.
# In prompts vult de app {functie}, {afdeling}, {resultaat}, {stap}, {oplevert} en {punten} in.

titel: "Van resultaat naar taak"
pilot: "AI-pilot Customer Care"
sessie: "Kickoff, deel 2"

# De externe applicatie van deze pilot, bijvoorbeeld TOPdesk. Leeg laten: "een externe applicatie".
extern: "Salesforce"

dataregel: "Je mag gegevens gebruiken waar je zelf bij kunt, ook klantgegevens. Maar haal geen gegevens van de ene applicatie naar de andere: wat in {extern} staat, zet je niet in Copilot, en andersom. Twijfel je? Vraag het AI CoE."

codewoorden:
  start: "COPILOT"
  verder: "PROMPT"

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen klantgegevens in deze app."
  - "Geen gegevens uit {extern} in Copilot."

start:
  tekst: "Je hebt net uitleg en 2 demo's gezien. Nu ga je zelf aan de slag, op je eigen tempo. Er zijn 5 stappen."
  zo_werk_je: "Zet deze app links op je scherm en Copilot Chat rechts. Kopieer prompts met het icoon rechtsboven in het grijze vak."
  functie_label: "Mijn functie (bijvoorbeeld: medewerker klantenservice, specialist schade, teamleider)"
  functie_hulp: "De app zet je functie en afdeling in de prompts. Vul je functie in, niet je naam."
  afdeling_label: "Mijn afdeling of team (bijvoorbeeld: Customer Care, Finance, HR)"
  afdeling_standaard: "Customer Care"
  waarom: "Deze route stuurt Copilot stap voor stap: eerst laten begrijpen, dan pas laten maken."

stappen:
  resultaat:
    titel: "Je resultaat"
    tijd: 5
    intro: "Kies iets dat je regelmatig oplevert, voor jezelf of voor een ander. Denk aan de laatste keer dat je het maakte."
    goed_resultaat:
      - "komt regelmatig terug, of is steeds hetzelfde soort werk"
      - "is voor jezelf of voor een ander: een klant, collega, leidinggevende of andere afdeling"
      - "kost je moeite of tijd"
    te_groot: "Klantvragen beantwoorden"
    beter: "Antwoord op een vraag over een vertraagd internationaal pakket"
    demos:
      - "Een mail aan Insurance opstellen met alle gegevens van een schadegeval"
      - "Een brief van een klant samenvatten en 3 mogelijke reacties voorstellen"
    resultaat_label: "Wat lever je regelmatig op, en voor wie?"
    extern_tekst: "Werk je vooral in {extern}? Dan mag je resultaat daar ook over gaan. Het interview doe je in Copilot: je vertelt hoe je werkt, zonder gegevens uit {extern}. In stap 4 probeer je je stap in de tool die past."
    weet_niet_titel: "Weet je niet wat je kiest? Laat Copilot je agenda bekijken"
    weet_niet_tekst: "Kopieer deze prompt naar Copilot. Copilot kijkt in je agenda en stelt je 3 vragen. Je krijgt 5 resultaten die je regelmatig oplevert. Kies er 1."
    weet_niet_prompt: "Bekijk alleen mijn agenda van de afgelopen 2 weken, niet mijn mailbox. Stel me daarna 3 vragen, 1 tegelijk, over werk dat ik regelmatig maak. Geef dan 5 resultaten die ik regelmatig oplever, zoals antwoorden, overzichten of updates. Geef per resultaat: wat het is, voor wie, en hoe vaak ongeveer. Noem geen klantgegevens. Geef alleen een tabel."

  interview:
    titel: "Laat Copilot je interviewen"
    tijd: 10
    intro: "Kopieer de prompt hieronder met het icoon rechtsboven in het grijze vak. Plak hem in Copilot Chat. Beantwoord de vragen 1 voor 1. Jouw resultaat staat er al in."
    waarom: "Copilot vraagt eerst waar het meeste gedoe zit. Daar zoomt hij op in. Zo hoort hij wat niet in je mails of bestanden staat: hoe jij dit werk doet en waar het vastloopt."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL.

      Doel: ik wil uitzoeken waar Copilot mij helpt bij dit resultaat: {resultaat}. Check eerst in 1 zin of dit iets is dat regelmatig terugkomt. Zo niet, help me met maximaal 2 vragen een beter resultaat te kiezen.

      Context: interview me over de laatste keer dat ik het maakte. Vraag eerst waar het meeste gedoe zat. Vraag daarna vooral door op dat deel: wat ik deed, waar het stokte (zoeken, wachten of afstemmen), en wat ik opnieuw moest doen.

      Actie: stel 1 vraag tegelijk en zet erbij welke vraag het is, bijvoorbeeld "Vraag 2 van maximaal 8". Geef bij elke vraag een kort voorbeeld van een antwoord. Bouw voort op mijn antwoorden. Past een vraag niet bij mijn situatie, sla hem dan over. Vraag niet naar tijd of minuten. Vat na 4 vragen in 2 zinnen samen wat je begrijpt en vraag of het klopt. Noem geen klantgegevens.

      Verwachting: geef na maximaal 8 vragen alleen een tabel met 3 kolommen: Stap, Gedoe, Kans met Copilot (hoog of laag, met een korte reden). Maximaal 6 woorden per vakje. Alleen stappen die ik noemde, voeg er geen toe. Bedenk nog geen oplossingen.
    opbouw: "Let op de opbouw van deze prompt. Eerst je functie, die vult de app in. Dan 4 delen: Doel (wat wil je), Context (wat moet Copilot weten), Actie (hoe moet Copilot werken) en Verwachting (wat wil je terug). Die 4 delen schrijf je in sessie 2 zelf."
    waarschuwing: "Vraagt Copilot naar een klant of een klantnummer? Antwoord in algemene woorden: \"een klant met een vraag over een pakket\"."
    terug_tip: "Stelt Copilot voor om een ander resultaat te kiezen? Ga terug naar stap 1 en pas het aan. De prompts passen zich vanzelf aan."
    hulp:
      - label: "Ik snap de vraag niet"
        prompt: "Ik snap je vraag niet. Leg in 1 zin uit waarom je dit vraagt en geef een voorbeeld van een antwoord."
      - label: "Begrijpt Copilot mij wel?"
        prompt: "Vat in 3 zinnen samen wat je tot nu toe van mijn situatie begrijpt. Wat mis je nog over hoe het ging? Vraag niet naar tijd."
      - label: "Geen van de opties past"
        prompt: "Geen van je opties past. Het zit zo: [jouw situatie]. Ga verder met je volgende vraag."
      - label: "De tabel heeft te veel tekst"
        prompt: "Maak de tabel korter. Maximaal 6 woorden per vakje. Verander verder niets. Geef alleen de tabel."

  kies:
    titel: "Check en kies"
    tijd: 10
    intro: "Copilot schreef op wat jij vertelde. Eerst kijk je of dat klopt. Daarna kies je 1 stap om met Copilot te proberen."
    check_titel: "a. Klopt je tabel?"
    check_tekst: "Lees je tabel. Klopt hij met hoe het de laatste keer echt ging? Mist er iets, zoals wachten op iemand of afstemmen? Staat er iets in dat jij niet zei? Pas het aan met een prompt hieronder."
    waarom: "Copilot vult gaten soms zelf in. En stappen als wachten of afstemmen zijn juist stappen waar AI niet helpt. Als je ze ziet, kies je ze niet."
    bijsturen:
      - "Je mist een stap: [stap]. Voeg hem toe op de juiste plek. Verander verder niets. Geef alleen de tabel."
      - "Stap [nummer] klopt niet. Het ging zo: [wat er echt gebeurde]. Verander verder niets. Geef alleen de tabel."
      - "Maak de tabel korter. Maximaal 6 woorden per vakje. Verander verder niets. Geef alleen de tabel."
    plak_label: "Plak hier je tabel (kopieer hem met de kopieerknop onder het antwoord van Copilot)"
    tabel_ok: "Zo ziet je tabel eruit:"
    kies_titel: "b. Kies 1 stap"
    kies_intro: "Kies 1 stap om met Copilot te proberen. Begin met een Mens + AI-stap: Copilot doet het voorwerk, jij controleert de uitkomst. Kijk ook naar de kolom Kans met Copilot. Copilot schat zichzelf vaak te hoog in, dus jij beslist."
    goed_titel: "Hier is Copilot goed in"
    goed:
      - "iets lezen en samenvatten"
      - "een eerste versie schrijven"
      - "ordenen of structureren"
      - "vergelijken"
      - "uitleggen in andere woorden"
      - "controleren tegen een instructie"
    niet_titel: "Hier helpt Copilot niet"
    niet:
      - "wachten op iemand"
      - "een besluit nemen"
      - "iets invoeren in een systeem"
    stap_label: "Mijn stap, in woorden"
    stap_hulp: "Schrijf wat je doet, niet het nummer uit de tabel. Niet: \"Stap 2\". Wel: \"De voorgeschiedenis van een klant samenvatten voor mijn antwoord\"."
    stap_fout: "Beschrijf je stap in woorden, niet met een nummer. Copilot weet niet wat \"stap 2\" is."
    oplevert_label: "Wat moet deze stap opleveren, en voor wie?"
    oplevert_hulp: "Alleen deze stap, niet je hele resultaat."
    punten_titel: "c. Is je stap klein genoeg?"
    punten_label: "Schrijf 3 punten op die zeker in de uitkomst van deze stap moeten staan"
    punten_hulp: "Bijvoorbeeld: het schadebedrag, de datum van verzending, een vraag om bewijs. Lukt het niet om 3 punten te noemen? Dan is je stap te groot."
    opdelen_titel: "Is je stap te groot? Laat Copilot alleen deze stap opdelen"
    opdelen_tekst: "Je hoeft niet terug naar het begin. Kies daarna 1 kleine stap en pas het veld Mijn stap hierboven aan."
    opdelen_prompt: "Mijn stap is: {stap}. Hij is te groot om in 1 keer met Copilot te proberen. Deel alleen deze stap op in 3 tot 5 kleinere stappen. Maximaal 6 woorden per stap. Geef alleen de lijst."
    idee_label: "Kan je stap niet in Copilot en niet in {extern}, bijvoorbeeld omdat er een koppeling tussen systemen nodig is? Schrijf hem op als idee voor het AI CoE. (optioneel)"

  wacht:
    titel: "Wacht op Gijs"
    tekst: "We horen kort welke stappen jullie kozen. Daarna geeft Gijs het codewoord voor de volgende stap."
    tip: "Klaar en tijd over? Lees je 3 punten nog 1 keer. Zijn ze concreet genoeg om de uitkomst straks aan te toetsen?"

  eerste:
    titel: "Je eerste resultaat"
    tijd: 15
    intro: "Probeer je stap nu echt, in de tool die bij je stap past. Je 3 punten uit stap 3 staan al klaar."
    tool_label: "In welke tool probeer je deze stap?"
    tool_opties: ["Copilot", "{extern}"]
    tool_hulp: "Staan de gegevens die je nodig hebt in {extern}? Dan doe je de stap daar, met de AI van {extern}. Anders doe je hem in Copilot."
    punten_label: "Mijn 3 punten (uit stap 3, pas aan als dat nodig is)"
    waarom: "Copilot vraagt eerst wat ontbreekt en zegt aan het eind wat het aannam, zodat jij weet wat je moet controleren."
    prompt: |-
      Ik werk als {functie} bij {afdeling} van PostNL.

      Doel: ik wil hulp bij deze stap: {stap}. Dit moet het opleveren: {oplevert}.

      Context: vraag me welke bronnen je mag gebruiken.

      Actie: stel me eerst maximaal 3 vragen, 1 tegelijk. Stel een open vraag als een keuze uit 2 niet past. Doe daarna de stap.

      Verwachting: dit moet er zeker in staan: {punten}. Houd het kort. Benoem aan het eind je aannames, ontbrekende informatie en wat ik zelf moet controleren.
    opbouw: "Herken je de 4 delen weer? Doel, Context, Actie, Verwachting. Zo schrijf je straks je eigen instructie."
    bronnen_tip:
      copilot: "Vraagt Copilot welke bronnen hij mag gebruiken? Kies bewust. Gebruik alleen bronnen waar je zelf bij kunt, en niets uit {extern}."
      extern: "Werk in {extern} alleen met de case waar je nu mee bezig bent. Kopieer niets uit {extern} naar Copilot of naar deze app."
    klantregel: "Gaat de tekst naar een klant? Lees hem helemaal en check de gegevens tegen de case. Een tekst van AI gaat nooit naar een klant zonder dat jij hem hebt gelezen."
    bijsturen_titel: "Niet goed genoeg? Stuur bij in 1 zin"
    bijsturen_tip: "Verander steeds 1 ding en vergelijk met het vorige antwoord. Is het beter?"
    bijsturen:
      - label: "Te algemeen"
        prompt: "Maak het specifieker voor [situatie]."
      - label: "Verkeerde toon"
        prompt: "Dit is voor [ontvanger]. Pas de toon aan."
      - label: "Twijfel of het klopt"
        prompt: "Welke aannames maak je in dit antwoord?"
      - label: "Je wilt opties"
        prompt: "Geef 2 andere versies."
      - label: "Rommelig"
        prompt: "Orden het met koppen."
      - label: "Te lang"
        prompt: "Geef alleen het resultaat, zonder advies en uitleg."
    bijsturing_label: "Welke bijsturing maakte het verschil? (leeg laten als je niet bijstuurde)"
    controle_intro: "Controleer de uitkomst. Vink aan wat klopt."
    controle:
      - "Mijn 3 punten staan erin"
      - "Klopt het? Feiten en bronnen nagekeken"
      - "Past het? Bij de ontvanger, de toon, PostNL"
      - "Helpt het? Sneller, beter, consistenter of makkelijker"
      - "Mag het? Input en output veilig"
    scores: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar"]
    herstel_label: "Wat moest je zelf nog doen voordat het bruikbaar was?"
    teams: "Mijn stap: {stap}. Tool: {tool}. Score: {score}. Wat ik nog moest doen: {herstel}"

  plan:
    titel: "Je plan"
    tijd: 5
    intro: "Plan 2 momenten deze week waarop je dit opnieuw doet, op echt werk. Zet ze nu in je agenda."
    waarom: "Pas na een paar keer op echt werk weet je of dit helpt en wat je moet aanpassen."
    tests:
      - "Test 1: dag en tijd"
      - "Test 2: dag en tijd"
    afsluiting: "Zet je pdf in de map Kickoff in het Teams-kanaal. Wacht daarna op Gijs voor de afsluiting."
