# Inhoud van workshop 3 Mail: Gebruik elkaars oplossing. Pas teksten hier aan.

titel: "Gebruik elkaars oplossing"
pilot: "AI-pilot Mail Commercie"
sessie: "Workshop 3"

zijbalk_waarschuwingen:
  - "Ververs deze pagina niet. Dan ben je je invoer kwijt."
  - "Geen klantgegevens invullen."

start:
  tekst: "Vandaag gebruikt een collega jouw oplossing, en jij die van een collega. Zo zie je of jouw oplossing zonder jou werkt, en doe je zelf ervaring op met AI op werk dat je niet kent."
  waarom: "Een oplossing die alleen werkt als jij erbij bent, kan niemand anders gebruiken. Pas als een ander hem zonder uitleg gebruikt, weet je wat hij waard is."
  functie_label: "Mijn functie (geen naam)"
  afdeling_label: "Mijn afdeling of team"
  afdeling_standaard: "Mail Commercie"

stappen:
  klaarzetten:
    titel: "Zet je test klaar"
    tijd: 8
    intro: "Je tester gebruikt straks jouw oplossing op jouw laptop. Jij schrijft nu de test. In de volgende stap zie je wat je met je tester deelt."
    tests_vraag: "Hoe gingen je tests sinds workshop 2?"
    tests_opties: ["Bruikbaar", "Deels bruikbaar", "Niet bruikbaar", "Niet getest"]
    opleveren_label: "Wat levert je oplossing op, en voor wie? (1 zin)"
    waar_label: "Waar vindt de tester je oplossing? (bijvoorbeeld: de naam van je agent in Copilot, of: de prompt hieronder)"
    prompt_label: "Je prompt of instructie (alleen als je geen agent hebt)"
    vinkje_klaar: "Mijn oplossing en de input staan klaar op mijn laptop. Geen klantgegevens."
    voorbeelden_titel: "🔎 Voorbeelden: wat is 1 ding anders, wat is een randgeval?"
    voorbeelden:
      - "**Analyse in Excel.** 1 ding anders: een vraag die je niet bedacht, of een ander bestand. Randgeval: een vraag waarvan het antwoord niet in de data staat. Goed antwoord: dat weet ik niet."
      - "**Incidentenmelder.** 1 ding anders: een melding in steekwoorden, vaag of in het Engels. Randgeval: iets dat geen incident is, of zonder locatie. Goed antwoord: doorvragen, niet zelf invullen."
      - "**Informatie voor een bila.** 1 ding anders: een andere collega of een andere periode. Randgeval: een gevoelig onderwerp. Goed antwoord: dat hoort er niet in."
      - "**Iets anders.** 1 ding anders: andere input, een ander format of een andere vraag. Randgeval: een vraag waarop het goede antwoord is: dat weet ik niet, of dat mag niet."
    test_namen:
      - "Test 1: exact zoals jij het gebruikt"
      - "Test 2: 1 ding anders"
      - "Test 3: randgeval (het goede antwoord is: dat weet ik niet, of dat mag niet)"
    invoer_label: "Wat voert de tester in?"
    moet_label: "Moet erin staan"
    magniet_label: "Mag er niet in staan"
    test4: "Test 4 schrijf je niet. Die bedenkt de tester zelf: 1 vraag of input die jij niet bedacht."
    waarom: "Wie vooraf opschrijft wat goed is, ziet straks wat er misgaat. Zonder lat zegt iedereen: ziet er goed uit."

  delen:
    titel: "Deel je testopdracht"
    tijd: 2
    intro: "Kopieer de testopdracht met het icoon rechtsboven in het grijze vlak. Zet hem in een Word-bestand of kladblok naast Copilot op je laptop. Daar leest je tester hem."
    kop: "Testopdracht"
    tester_instructie: "Voer elke test uit zonder hulp van de maker. Beoordeel na elke test: werkte het, deels, of niet? Vergelijk met wat erin moet en wat er niet in mag."
    test4: "Test 4: bedenk zelf 1 vraag of input die de maker niet bedacht."
    vinkje: "Mijn testopdracht staat open op mijn laptop"

  ronde:
    titel_1: "Testronde 1"
    titel_2: "Testronde 2"
    tijd: 20
    rol_vraag: "Wat ben je in ronde 1?"
    rollen: ["Maker", "Tester"]
    rol_2: "In ronde 2 ben je {rol}. Je partner blijft dezelfde."
    regels:
      - "De tester typt, achter de laptop van de maker."
      - "De maker zwijgt en schrijft mee in deze app."
      - "Gijs roept af: test 1, test 2, test 3, test 4, stop."
    maker_intro: "Kijk mee en schrijf direct op wat er gebeurt. Niet helpen, niet uitleggen."
    tester_intro: "Gebruik de oplossing zoals de testopdracht zegt. Lukt het niet zonder hulp? Dan is dat de uitkomst."
    test4_naam: "Test 4: bedacht door de tester"
    uitkomst_opties: ["Werkte", "Deels", "Werkte niet"]
    mis_label: "Wat ging er mis? (mag leeg als het werkte)"
    magniet_vraag: "Stond er iets in dat er niet in mocht?"
    magniet_opties: ["Nee", "Ja"]
    oorzaak_vraag: "Werkte iets niet? Wat was de oorzaak?"
    oorzaken:
      - "Input: met andere input werkt het wel"
      - "Instructie: het resultaat is vaag of steeds anders"
      - "Vorm: een agent, maar je stuurt elke keer bij"
      - "Geen AI-taak: na 2 pogingen nog niet bruikbaar"
      - "Alles werkte"
    wat_nu:
      "Input": "Wat nu? Laat AI de input eerst ordenen en markeren wat ontbreekt."
      "Instructie": "Wat nu? Scherp 1 ding aan in je instructie en test opnieuw."
      "Vorm": "Wat nu? Terug naar assisteren: laat Copilot eerst meedenken, daarna pas delegeren."
      "Geen AI-taak": "Wat nu? Stoppen is een goed besluit. Je weet nu waar AI niet helpt."
      "Alles werkte": "Wat nu? Probeer straks bij het aanpassen een moeilijker randgeval."
    herstel_label: "Wat moest de tester zelf nog doen voordat het bruikbaar was?"
    ding_label: "1 ding dat ik aanpas in mijn oplossing"
    tester_oplossing_label: "Wat doet de oplossing van je partner? (1 zin)"
    tester_test4_label: "Wat bedacht je bij test 4, en wat gebeurde er?"
    gebruik_vraag: "Zou je deze oplossing zelf willen gebruiken?"
    gebruik_opties: ["Ja", "Misschien, met een aanpassing", "Nee, past niet bij mijn werk"]
    tester_leer_label: "Wat neem je mee voor je eigen werk met Copilot?"
    waarom: "Als tester gebruik je AI op een taak die je niet kent. Dat is nieuwe ervaring. Als maker zie je waar je oplossing nog op jou leunt."

  aanpassen:
    titel: "Pas 1 ding aan"
    tijd: 10
    intro: "Pas het ding aan dat je in je testronde vond. Test daarna zelf opnieuw, met de test die misging."
    ding_kop: "Jouw 1 ding"
    gedaan_label: "Wat heb je aangepast?"
    werkt_vraag: "Werkt het nu?"
    werkt_opties: ["Ja", "Deels", "Nee", "Niet aan toegekomen"]
    waarom: "Een aanpassing die je meteen test, is een besluit met grond. Anders blijft het een voornemen."

  besluit:
    titel: "Besluit en showcase"
    tijd: 10
    intro: "Je oplossing is getest door een collega, en jij hebt die van een collega gebruikt. Wat doe je nu?"
    opties:
      - "Borgen: ik gebruik hem vast, alleen voor mezelf"
      - "Delen: ik deel hem met mijn team"
      - "Aanpassen: ik pas hem aan en test verder"
      - "Stoppen: hij helpt niet genoeg, ik stop ermee"
      - "Doorverwijzen: hij heeft een koppeling met een ander systeem nodig, ik geef hem door aan het AI CoE"
    waarom_label: "Waarom dit besluit?"
    veilig:
      - "Welke data gaat erin? Alleen data binnen Copilot, geen klant- of persoonsgegevens"
      - "Wie krijgt toegang? Dat weet ik"
      - "Gaat er output naar buiten zonder dat een mens kijkt? Nee"
    delen_label: "Met wie deel je hem, en waar zet je hem neer?"
    twijfel: "Twijfel? Niet delen. Vraag het eerst aan het AI CoE."
    door_label: "Welk systeem of welke koppeling is nodig?"
    trigger_intro: "Wanneer gebruik je je oplossing? Maak het concreet."
    als_label: "Als ... (bijvoorbeeld: als ik een melding krijg, of: elke maandag bij de planning)"
    dan_label: "dan ..."
    showcase_kop: "Volgende week: de showcase"
    showcase:
      - "Je laat je oplossing live zien, 3 minuten."
      - "Vertel wat het oplevert, wat er misging in de test, wat je aanpaste en wat je besluit."
      - "Oefen 1 keer. Zet een screenshot van een goede uitkomst klaar, voor als het live niet werkt."
      - "Extra: laat je oplossing vóór de showcase zien aan 1 collega buiten de groep. Laat hem of haar zelf typen."
    teams: "Mijn oplossing: {oplossing}. Getest door een collega: {uitkomst}. Besluit: {besluit}."
    afsluiting: "Zet je pdf in de map Workshop 3 in het Teams-kanaal."
    waarom: "Een oplossing zonder besluit blijft liggen."
